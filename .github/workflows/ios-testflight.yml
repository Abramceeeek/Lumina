name: iOS TestFlight

# Builds a signed iOS app on a GitHub macOS runner (free for public repos) and
# uploads it to TestFlight — no Expo cloud. Manual trigger.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                - your 10-char Apple Developer Team ID
#   APPSTORE_API_KEY_ID          - App Store Connect API key ID
#   APPSTORE_API_ISSUER_ID       - App Store Connect API issuer ID
#   APPSTORE_API_KEY_P8_BASE64   - the AuthKey_*.p8 file, base64-encoded
#   EXPO_PUBLIC_SUPABASE_URL     - (already set for the Android build)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#
# One-time on Apple's side: create the app in App Store Connect (Apps → +) with
# bundle id com.abramceeeek.lumina before the first upload.

on:
  workflow_dispatch:
    inputs:
      clean_certs:
        description: "Revoke existing distribution certs first (one-time)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Pre-resolve Swift packages
        run: cd ios && xcodebuild -resolvePackageDependencies -workspace Lumina.xcworkspace -scheme Lumina || true

      - name: Stage App Store Connect API key
        run: |
          mkdir -p "${{ github.workspace }}/private_keys"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"

      - name: Configure git (for match storage)
        run: |
          git config --global user.email "ci@lumina.app"
          git config --global user.name "Lumina CI"

      - name: Clean orphaned distribution certs (one-time)
        if: ${{ inputs.clean_certs }}
        run: fastlane clean_certs
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.KEY_PATH }}

      - name: Set up signing (match)
        run: fastlane setup_signing
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Archive (xcodebuild)
        run: |
          brew install xcbeautify >/dev/null 2>&1 || true
          cd ios
          set -o pipefail
          xcodebuild -workspace Lumina.xcworkspace -scheme Lumina -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" -sdk iphoneos -jobs 1 archive 2>&1 \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.abramceeeek.lumina</key><string>match AppStore com.abramceeeek.lumina</string>
            </dict>
          </dict></plist>
          PLIST
          cd ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: fastlane upload
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.KEY_PATH }}
          IPA_PATH: ${{ runner.temp }}/export/Lumina.ipa
